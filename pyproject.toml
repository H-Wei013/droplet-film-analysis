[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droplet-film-analysis"
version = "0.1.0"
description = "Local BMP droplet/film analysis and manual review, using the 5.3.1 numerical engine."
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "opencv-python", "matplotlib", "PyYAML"]

[project.scripts]
droplet-film-analysis = "watercar_tool.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
droplet_analysis = ["*.js", "*.html", "config.json"]
watercar_tool = ["*.js"]
